<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PanExpress Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --ink: #172033;
      --muted: #64748b;
      --line: #e2e8f0;
      --panel: #ffffff;
      --page: #f6f7fb;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --drawer: #182235;
      --success: #15803d;
      --warning: #b45309;
      --danger: #dc2626;
    }

    body {
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .drawer {
      width: 260px;
      flex: 0 0 260px;
      background: var(--drawer);
      color: #ffffff;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      padding: 8px 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .brand h2 {
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .brand p {
      color: #b7c2d7;
      font-size: 13px;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button,
    .logout-button,
    .menu-toggle,
    .refresh-button,
    .add-button {
      border: 0;
      cursor: pointer;
      font-size: 15px;
      border-radius: 8px;
      transition: 0.2s ease;
    }

    .nav button {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #dbeafe;
      text-align: left;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .drawer-footer {
      margin-top: auto;
      display: grid;
      gap: 12px;
      color: #b7c2d7;
      font-size: 13px;
    }

    .logout-button {
      padding: 11px 12px;
      background: #ef4444;
      color: #ffffff;
      text-align: center;
    }

    .logout-button:hover {
      background: var(--danger);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 72px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 28px;
    }

    .menu-toggle {
      display: none;
      width: 42px;
      height: 42px;
      background: #eef2ff;
      color: var(--brand);
      font-size: 22px;
      line-height: 1;
    }

    .page-title h1 {
      font-size: 24px;
      margin-bottom: 3px;
    }

    .page-title p {
      color: var(--muted);
      font-size: 14px;
    }

    .admin-chip {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 14px;
      background: #ffffff;
      white-space: nowrap;
    }

    .content {
      padding: 28px;
      display: grid;
      gap: 22px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 26px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-header h2 {
      font-size: 19px;
    }

    .panel-header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .refresh-button {
      padding: 10px 14px;
      background: var(--brand);
      color: #ffffff;
      font-size: 14px;
    }

    .refresh-button:hover {
      background: var(--brand-dark);
    }

    .add-button {
      padding: 10px 14px;
      background: var(--brand);
      color: #ffffff;
      font-size: 14px;
    }

    .add-button:hover {
      background: var(--brand-dark);
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .action-button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      padding: 8px 12px;
      transition: 0.2s ease;
    }

    .edit-button {
      background: #2563eb;
    }

    .edit-button:hover {
      background: #1d4ed8;
    }

    .delete-button {
      background: #dc2626;
    }

    .delete-button:hover {
      background: #b91c1c;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-top: 6px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: grid;
      place-items: center;
      z-index: 1000;
      padding: 18px;
    }

    .modal[hidden] {
      display: none;
    }

    .modal-content {
      width: 500px;
      max-width: 100%;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22);
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--ink);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .menu-form {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
    }


    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      color: #475569;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 700;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.admin {
      color: #7c2d12;
      background: #ffedd5;
    }

    .badge.staff {
      color: var(--brand-dark);
      background: #dbeafe;
    }

    .badge.user {
      color: var(--success);
      background: #dcfce7;
    }

    .empty-state,
    .error-text {
      padding: 22px 20px;
      text-align: center;
    }

    .empty-state {
      color: var(--muted);
    }

    .error-text {
      color: var(--danger);
      border-top: 1px solid var(--line);
      font-size: 14px;
    }

    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 10;
    }

    @media (max-width: 860px) {
      .drawer {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        transform: translateX(-100%);
        transition: 0.2s ease;
      }

      body.drawer-open .drawer {
        transform: translateX(0);
      }

      body.drawer-open .drawer-backdrop {
        display: block;
      }

      .menu-toggle {
        display: inline-grid;
        place-items: center;
      }

      .topbar {
        padding: 0 18px;
      }

      .content {
        padding: 18px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <div class="layout">
    <aside class="drawer" aria-label="Dashboard drawer">
      <div class="brand">
        <h2>PanExpress</h2>
        <p>Admin Dashboard</p>
      </div>

      <nav class="nav">
        <button type="button" class="active" data-view="users">Users Table</button>
        <button type="button" data-view="menu">Menu Table</button>
      </nav>

      <div class="drawer-footer">
        <span id="drawerUser">Signed in as Admin</span>
        <button type="button" class="logout-button" id="logoutButton">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open drawer">=</button>
        <div class="page-title">
          <h1 id="pageTitle">Users Table</h1>
          <p id="pageSubtitle">View user rows from the users API.</p>
        </div>
        <div class="admin-chip" id="adminChip">Admin</div>
      </header>

      <section class="content">
        <div class="stats">
          <div class="stat" id="usersStat">
            <span>Total Users</span>
            <strong id="totalUsers">0</strong>
          </div>
          <div class="stat" id="menusStat">
            <span>Total Menu</span>
            <strong id="totalMenus">0</strong>
          </div>
        </div>

        <section class="panel">
          <div class="panel-header">
            <div>
              <h2 id="tableTitle">User List</h2>
              <p id="tableDescription">Data source: GET /api/users.</p>
            </div>
            <div>
              <button type="button" class="refresh-button" id="refreshButton">Refresh</button>
              <button type="button" class="add-button" id="addButton" hidden>Add</button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState" hidden>No data available.</div>
          <div class="error-text" id="errorText" hidden></div>
        </section>
      </section>
    </main>
  </div>

  <div id="menuModal" class="modal" hidden>
    <div class="modal-content">
      <div class="panel-header">
        <h2>Add Menu</h2>
        <button type="button" class="modal-close" id="closeModal" aria-label="Close menu form">&times;</button>
      </div>

      <form id="menuForm" class="menu-form">
        <div class="form-group">
          <label>Menu Name</label>
          <input type="text" id="menuName" required />
        </div>

        <div class="form-group">
          <label>Route</label>
          <input type="text" id="route" placeholder="/pesan-makanan" required />
        </div>

        <div class="form-group">
          <label>Min Role Level</label>
          <input type="number" id="minRoleLevel" min="1" required />
        </div>

        <div class="form-group">
          <label>Max Role Level</label>
          <input type="number" id="maxRoleLevel" min="1" required />
        </div>

        <button type="submit" class="refresh-button" id="saveMenuButton">
          Save Menu
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:8080/api';

    const state = {
      view: 'users',
      users: [],
      menus: [],
      error: '',
    };

    const token = localStorage.getItem('token');
    const storedUser = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token) {
      window.location.href = 'login.html';
    }

    const menuModal =
      document.getElementById('menuModal');

    document
      .getElementById('addButton')
      .addEventListener('click', () => {

        if (state.view === 'menu') {
          menuModal.hidden = false;
        }
      });

    document
      .getElementById('closeModal')
      .addEventListener('click', () => {

        menuModal.hidden = true;
      });

    const elements = {
      adminChip: document.getElementById('adminChip'),
      drawerUser: document.getElementById('drawerUser'),
      pageTitle: document.getElementById('pageTitle'),
      pageSubtitle: document.getElementById('pageSubtitle'),
      tableTitle: document.getElementById('tableTitle'),
      tableDescription: document.getElementById('tableDescription'),
      tableHead: document.getElementById('tableHead'),
      tableBody: document.getElementById('tableBody'),
      emptyState: document.getElementById('emptyState'),
      errorText: document.getElementById('errorText'),
      addButton: document.getElementById('addButton'),
      menuForm: document.getElementById('menuForm'),
      saveMenuButton: document.getElementById('saveMenuButton'),
      totalUsers: document.getElementById('totalUsers'),
      totalMenus: document.getElementById('totalMenus'),
      staffUsers: document.getElementById('staffUsers'),
      usersStat: document.getElementById('usersStat'),
      menusStat: document.getElementById('menusStat'),
    };

    if (storedUser) {
      elements.adminChip.textContent = storedUser.username || 'Admin';
      elements.drawerUser.textContent = `Signed in as ${storedUser.username || 'Admin'}`;
    }

    document.getElementById('menuToggle').addEventListener('click', () => {
      document.body.classList.add('drawer-open');
    });

    document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

    document.getElementById('logoutButton').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    document.getElementById('refreshButton').addEventListener('click', loadCurrentView);

    document.querySelectorAll('.nav button').forEach((button) => {
      button.addEventListener('click', async () => {
        state.view = button.dataset.view;
        await loadCurrentView();
        closeDrawer();
      });
    });

    function closeDrawer() {
      document.body.classList.remove('drawer-open');
    }

    function getArrayPayload(data, key) {
      if (Array.isArray(data)) {
        return data;
      }

      if (data && Array.isArray(data[key])) {
        return data[key];
      }

      if (data && Array.isArray(data.data)) {
        return data.data;
      }

      return [];
    }

    function setError(message) {
      state.error = message || '';
      elements.errorText.textContent = state.error;
      elements.errorText.hidden = !state.error;
    }

    function renderStats() {
      elements.totalUsers.textContent = state.users.length;
      elements.totalMenus.textContent = state.menus.length;
      state.users.filter((user) => user.roleLevel === 2).length;
    }

    function renderUsers() {
      elements.tableHead.innerHTML = `
        <tr>
          <th>User ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role Level</th>
          <th>CRUD</th>
        </tr>
      `;

      elements.tableBody.innerHTML = state.users.map((user) => `
      <tr>
        <td>${user.id}</td>
        <td>${user.username}</td>
        <td>${user.email}</td>
        <td>${user.roleLevel}</td>
        <td>
          <div class="action-group">
            <button
              class="action-button edit-button"
              onclick="editUser(${user.id})"
            >
              Edit
            </button>

            <button
              class="action-button delete-button"
              onclick="deleteUser(${user.id})"
            >
              Delete
            </button>
          </div>
        </td>
      </tr>
      `).join('');

      elements.emptyState.hidden = state.users.length > 0;
    }

    document
      .getElementById('menuForm')
      .addEventListener(
        'submit',
        async (e) => {

          e.preventDefault();

          try {
            const minRoleLevel = Number(
              document.getElementById('minRoleLevel').value
            );
            const maxRoleLevel = Number(
              document.getElementById('maxRoleLevel').value
            );

            if (maxRoleLevel < minRoleLevel) {
              throw new Error('Max role level must be greater than or equal to min role level');
            }

            elements.saveMenuButton.disabled = true;
            elements.saveMenuButton.textContent = 'Saving...';

            const response = await fetch(
              `${API_BASE_URL}/menu`,
              {
                method: 'POST',
                headers: {
                  'Content-Type':
                    'application/json',
                  Authorization:
                    `Bearer ${token}`,
                },
                body: JSON.stringify({
                  menu_name:
                    document.getElementById(
                      'menuName'
                    ).value,

                  route:
                    document.getElementById(
                      'route'
                    ).value,

                  min_role_level: minRoleLevel,

                  max_role_level: maxRoleLevel,
                }),
              }
            );

            const data =
              await response.json();

            if (!response.ok) {
              throw new Error(
                data.error ||
                'Failed to create menu'
              );
            }

            alert(data.message);

            menuModal.hidden = true;

            elements.menuForm.reset();

            await loadMenus();

            renderView();


          } catch (error) {

            alert(error.message);
          } finally {
            elements.saveMenuButton.disabled = false;
            elements.saveMenuButton.textContent = 'Save Menu';
          }
        }
      );


    async function deleteUser(id) {

      const confirmed = confirm(
        'Delete this user?'
      );

      if (!confirmed) {
        return;
      }

      try {

        const response = await fetch(
          `${API_BASE_URL}/users/${id}`,
          {
            method: 'DELETE',
            headers: {
              Authorization: `Bearer ${token}`,
            },
          },
        );

        if (!response.ok) {
          throw new Error(
            'Failed to delete user'
          );
        }

        await loadUsers();

        renderView();

        alert('User deleted successfully');

      } catch (error) {

        console.error(error);

        alert(error.message);
      }
    }

    async function editUser(id) {

      const user = state.users.find(
        (u) => u.id === id
      );

      if (!user) {
        alert('User not found');
        return;
      }

      const username = prompt(
        'Edit username:',
        user.username
      );

      if (!username) {
        return;
      }

      const email = prompt(
        'Edit email:',
        user.email
      );

      if (!email) {
        return;
      }

      const roleLevel = prompt(
        'Edit role level:',
        user.roleLevel
      );

      if (!roleLevel) {
        return;
      }

      try {

        const response = await fetch(
          `${API_BASE_URL}/users/${id}`,
          {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              username,
              email,
              role_level: Number(roleLevel),
            }),
          },
        );

        if (!response.ok) {
          throw new Error(
            'Failed to update user'
          );
        }

        await loadUsers();

        renderView();

        alert('User updated successfully');

      } catch (error) {

        console.error(error);

        alert(error.message);
      }
    }

    function renderMenus() {
      elements.tableHead.innerHTML = `
        <tr>
          <th>Menu ID</th>
          <th>Menu Name</th>
          <th>Route</th>
          <th>Min Role</th>
          <th>Max Role</th>
        </tr>
      `;

      elements.tableBody.innerHTML = state.menus.map((menu) => `
        <tr>
          <td>${menu.id}</td>
          <td>${menu.name}</td>
          <td>${menu.route}</td>
          <td>${menu.minRoleLevel}</td>
          <td>${menu.maxRoleLevel}</td>
        </tr>
      `).join('');

      elements.emptyState.hidden = state.menus.length > 0;
    }

    function renderView() {
      document.querySelectorAll('.nav button').forEach((button) => {
        button.classList.toggle('active', button.dataset.view === state.view);
      });

      if (state.view === 'menu') {
        elements.pageTitle.textContent = 'Menu Table';
        elements.pageSubtitle.textContent = 'View menu rows from the menu API.';
        elements.tableTitle.textContent = 'Menu List';
        elements.tableDescription.textContent = 'Data source: GET /api/menus';
        elements.addButton.hidden = false;
        elements.usersStat.hidden = true;
        elements.menusStat.hidden = false;
        renderMenus();
      } else {
        elements.pageTitle.textContent = 'Users Table';
        elements.pageSubtitle.textContent = 'View user rows from the users API.';
        elements.tableTitle.textContent = 'User List';
        elements.tableDescription.textContent = 'Data source: GET /api/users.';
        elements.addButton.hidden = true;
        elements.usersStat.hidden = false;
        elements.menusStat.hidden = true;
        renderUsers();
      }

      renderStats();
    }

    async function authorizedGet(paths) {
      let lastError = null;

      for (const path of paths) {
        try {
          const response = await fetch(`${API_BASE_URL}${path}`, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (response.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
            return null;
          }

          if (!response.ok) {
            throw new Error(`GET /api${path} failed with status ${response.status}`);
          }

          return response.json();
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error('Unable to load data');
    }

    async function loadUsers() {
      const data = await authorizedGet(['/users']);
      state.users = getArrayPayload(data, 'users').map((user) => {
        return {
          id: user.id,
          username: user.username,
          email: user.email,
          roleLevel: user.role_level,
        };
        console.log(state.users);
      });
    }

    async function loadMenus() {
      const data = await authorizedGet(['/menus']);
      state.menus = getArrayPayload(data, 'menu').map((menu) => ({
        id: menu.id,
        name: menu.menu_name,
        route: menu.route,
        minRoleLevel: menu.min_role_level,
        maxRoleLevel: menu.max_role_level,
      }));
    }

    async function loadDashboardData() {
      setError('');

      try {
        await Promise.all([
          loadUsers(),
          loadMenus(),
        ]);
      } catch (error) {
        setError(error.message);
      }

      renderView();
    }

    async function loadCurrentView() {
      setError('');

      try {
        if (state.view === 'menu') {
          await loadMenus();
        } else {
          await loadUsers();
        }
      } catch (error) {
        setError(error.message);
      }

      renderView();
    }

    loadDashboardData();
  </script>
</body>

</html>
