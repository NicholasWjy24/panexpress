<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanExpress Users</title>

  <link rel="stylesheet" href="../layout/layout.css">
  <link rel="stylesheet" href="user.css">
</head>

<body>
  <div class="layout">
    <div id="drawerContainer"></div>

    <main class="main">
      <div id="topbarContainer"></div>

      <section class="content">
        <div class="stats">
          <div class="stat">
            <span>Total Users</span>
            <strong id="totalUsers">0</strong>
          </div>
        </div>

        <section class="panel">
          <div class="panel-header">
            <div>
              <h2>User List</h2>
              <p>Data source: GET /api/users.</p>
            </div>
            <div>
              <button type="button" class="refresh-button" id="refreshButton">Refresh</button>
              <button type="button" class="add-button" id="addButton">Add</button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState" hidden>No users available.</div>
          <div class="error-text" id="errorText" hidden></div>
        </section>
      </section>
    </main>
  </div>

  <div id="userModal" class="modal" hidden>
    <div class="modal-content">
      <div class="panel-header">
        <h2>Add User</h2>

        <button type="button" id="closeUserModal" class="modal-close" aria-label="Close user form">
          &times;
        </button>
      </div>

      <form id="userForm" class="menu-form">

        <div class="form-group">
          <label for="newUsername">Username</label>
          <input type="text" id="newUsername" required>
        </div>

        <div class="form-group">
          <label for="newEmail">Email</label>
          <input type="email" id="newEmail" required>
        </div>

        <div class="form-group">
          <label for="newPassword">Password</label>
          <input type="password" id="newPassword" required>
        </div>

        <div class="form-group">
          <label for="newRoleLevel">Role Level</label>
          <input type="number" id="newRoleLevel" min="1" required>
        </div>

        <button type="submit" class="refresh-button" id="saveUserButton">
          Save User
        </button>

      </form>
    </div>
  </div>

  <script src="../layout/layout.js"></script>
  <script src="user.js"></script>
</body>

</html>
